[package]
name = "raven"
version = "1.0.0"
edition = "2021"

[dependencies]
async-stream = "0.3"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "system-proxy", "gzip", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
# `fs` for ServeDir/ServeFile: the proxy serves the built panel (app/dist) itself.
tower-http = { version = "0.6", features = ["fs"] }
# Antigravity fingerprints the TLS ClientHello: the reference executor sends no
# ALPN extension at all, so the Antigravity client is built from a
# preconfigured rustls config with an empty `alpn_protocols`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
uuid = { version = "1", features = ["v4"] }
tiktoken-rs = "0.12.0"
